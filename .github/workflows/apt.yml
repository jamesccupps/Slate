# Slate's apt repository (https://jamesccupps.github.io/Slate/apt) on GitHub Pages: made again from the latest
# release's .deb files whenever a release is published, signed with APT_SIGNING_KEY (packaging/linux/apt-repo.sh).
# Installed packages add it (/etc/apt/sources.list.d/slate.list), so apt upgrade brings the new version.
# A published release runs this on its tag, which Pages doesn't publish from: it starts it again on main.
name: apt repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  start:
    name: Start on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apt.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: Make the repository
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: The latest release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'slate-linux-*.deb' --dir debs

      - name: Repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          command -v apt-ftparchive > /dev/null || { sudo apt-get update && sudo apt-get install -y apt-utils; }
          sh packaging/linux/apt-repo.sh debs site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
