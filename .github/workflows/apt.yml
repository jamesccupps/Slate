# Slate's site on GitHub Pages (https://jamesccupps.github.io/Slate/): the page in site/ with the images from
# docs/images, and the apt repository in apt/, made again from the latest release's .deb files and signed with
# APT_SIGNING_KEY (packaging/linux/apt-repo.sh). Installed packages add the repository
# (/etc/apt/sources.list.d/slate.list), so apt upgrade brings the new version.
# Runs when a release is published (on its tag, which Pages doesn't publish from, so it starts itself again on main)
# and when the page or its images change on main.
name: apt repository

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/apt.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  start:
    name: Start on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apt.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: Make the repository and the site
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: The latest release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'slate-linux-*.deb' --dir debs

      - name: Repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          command -v apt-ftparchive > /dev/null || { sudo apt-get update && sudo apt-get install -y apt-utils; }
          sh packaging/linux/apt-repo.sh debs pages

      - name: The page and its images
        run: |
          cp -r site/. pages/
          mkdir -p pages/images
          cp docs/images/*.png docs/images/*.gif pages/images/
          cp res/icon/s32.png pages/images/icon-32.png
          cp res/icon/s256.png pages/images/icon-256.png
          find pages -maxdepth 2 | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
