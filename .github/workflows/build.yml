# Builds and tests Slate on every push to main and every pull request: the Windows exe, and the Linux packages for
# x86-64 and ARM64 (Raspberry Pi).
# For a version tag (v1.2.3) it also signs Slate.exe and drafts a GitHub release with all of them attached; publishing
# the draft is what makes Slate's built-in updater on Windows offer it (it reads only Slate.exe and Slate.exe.sha256)
# and what updates the apt repository (apt.yml).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Write access only where the release is drafted.
permissions:
  contents: read

# The Rust every build uses: a newer one is taken on purpose (raised here, and on the development PC with it), never
# whatever "stable" happens to be on the day a tag is built.
env:
  RUST_VERSION: "1.99.0"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    env:
      # link with the toolchain's own MinGW files (rust-mingw), whatever else the runner has on its PATH
      RUSTFLAGS: -Clink-self-contained=yes
    steps:
      # (the job's token isn't left in .git: nothing here pushes, and gh has its own)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Slate's updater compares the release tag with the version built into Slate.exe: if they differ, every
          # Slate would download this release again every day. (The tag through the environment: never pasted into
          # the script.)
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "The tag $env:TAG doesn't match Cargo.toml's version ($v)" }

      - name: Rust (GNU toolchain, no Visual Studio needed)
        shell: pwsh
        run: |
          # rust-mingw brings the toolchain's own linker libraries (crt2.o, libkernel32.a...)
          rustup toolchain install "$($env:RUST_VERSION)-x86_64-pc-windows-gnu" --profile minimal --component rust-mingw
          rustup default "$($env:RUST_VERSION)-x86_64-pc-windows-gnu"

      - name: Test
        run: cargo test --lib --locked

      - name: Build
        run: cargo build --release --locked

      - name: Load configuration (Windows takes Slate.exe's DLLs from System32 only)
        shell: pwsh
        # GNU ld doesn't write it: points the exe at the one src/main.rs makes (DependentLoadFlags), before the exe is
        # tested, uploaded and signed. Fails if it isn't there.
        run: ./scripts/load-config.ps1 -Exe target/release/Slate.exe

      - name: Smoke test (the built Slate.exe, in its test mode)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Starts the exe users get, types, formats, saves and renders offscreen (tests\smoke.txt).
          $dir = Join-Path $env:RUNNER_TEMP smoke
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:SLATE_DATA_DIR = Join-Path $dir data
          $env:SLATE_TEST_LOG = Join-Path $dir log.txt
          $p = Start-Process -FilePath target\release\Slate.exe -ArgumentList '--test', "$PWD\tests\smoke.txt" -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if (Test-Path $env:SLATE_TEST_LOG) { Get-Content $env:SLATE_TEST_LOG }
          if ($p.ExitCode -ne 0) { throw "The smoke test failed (exit code $($p.ExitCode))" }

      - name: Install, stop opening files, uninstall (Slate.exe --install as winget runs it, --unassociate, --uninstall; the runner is thrown away after)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $classes = 'HKCU:\Software\Classes'
          $fileExts = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts'
          function Has($path, $name) { (Get-ItemProperty -LiteralPath $path -ErrorAction SilentlyContinue).PSObject.Properties.Name -contains $name }
          # What 0.8.1 and older left behind: Slate registered for .bat, and chosen to open it. --install takes both back.
          reg add 'HKCU\Software\Classes\.bat\OpenWithProgids' /v Slate.TextFile /t REG_NONE /f | Out-Null
          reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.bat\UserChoice' /v ProgId /d Slate.TextFile /f | Out-Null
          $p = Start-Process -FilePath target\release\Slate.exe -ArgumentList '--install' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--install failed (exit code $($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Slate\Slate.exe'
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Slate.lnk'
          $un = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Slate Text Editor'
          "$($un.DisplayName) $($un.DisplayVersion) by $($un.Publisher): $($un.QuietUninstallString)"
          if (!(Test-Path $exe) -or !(Test-Path $lnk)) { throw "--install didn't put Slate in place" }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($un.DisplayVersion -ne $v) { throw "Installed apps says $($un.DisplayVersion), not $v" }
          if (!(Has "$classes\.txt\OpenWithProgids" 'Slate.TextFile')) { throw "Slate isn't in .txt's Open with" }
          if (Has "$classes\.bat\OpenWithProgids" 'Slate.TextFile') { throw "Slate is still registered for .bat" }
          if (Has 'HKCU:\Software\Slate Text Editor\Capabilities\FileAssociations' '.bat') { throw ".bat is in Slate's Default apps list" }
          if (!(Has 'HKCU:\Software\Slate Text Editor\Capabilities\FileAssociations' '.txt')) { throw ".txt isn't in Slate's Default apps list" }
          if (Test-Path -LiteralPath "$fileExts\.bat\UserChoice") { throw "Slate is still chosen to open .bat files" }
          # Help > Stop opening files with Slate (--unassociate): Open with, Edit with Slate, Default apps and a choice
          # of Slate go; Slate stays installed.
          reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.conf\UserChoice' /v ProgId /d Slate.TextFile /f | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList '--unassociate' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--unassociate failed (exit code $($p.ExitCode))" }
          if (Has "$classes\.txt\OpenWithProgids" 'Slate.TextFile') { throw "--unassociate left Slate in .txt's Open with" }
          if (Test-Path -LiteralPath "$fileExts\.conf\UserChoice") { throw "--unassociate left the choice of Slate for .conf" }
          if (Has 'HKCU:\Software\RegisteredApplications' 'Slate Text Editor') { throw "--unassociate left Slate in Default apps" }
          if (Test-Path -LiteralPath "$classes\*\shell\Slate Text Editor") { throw "--unassociate left Edit with Slate" }
          if (Test-Path -LiteralPath "$classes\Slate.TextFile") { throw "--unassociate left Slate's file type" }
          if (!(Test-Path $lnk) -or !(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Slate Text Editor')) { throw "--unassociate took Slate off the Start menu or Installed apps" }
          $p = Start-Process -FilePath $exe -ArgumentList '--uninstall', '--quiet' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--uninstall failed (exit code $($p.ExitCode))" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Slate Text Editor') { throw "--uninstall left the Installed apps entry" }
          if (Test-Path $lnk) { throw "--uninstall left the Start menu entry" }
          # the installed copy goes too, a moment after it ended (renamed at once, then deleted; its folder with it)
          if (Test-Path $exe) { throw "--uninstall left $exe" }
          $gone = $false
          foreach ($k in 1..20) { if (!(Test-Path (Split-Path $exe))) { $gone = $true; break }; Start-Sleep -Seconds 1 }
          if (!$gone) { throw "--uninstall left Slate's folder: $(Get-ChildItem (Split-Path $exe) -Name)" }

      - name: Update from 0.15.0 (what it registered under plain "Slate" names moves to "Slate Text Editor"; the runner is thrown away after)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $classes = 'HKCU:\Software\Classes'
          $un = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $apps = 'HKCU:\Software\RegisteredApplications'
          function Has($path, $name) { (Get-ItemProperty -LiteralPath $path -ErrorAction SilentlyContinue).PSObject.Properties.Name -contains $name }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Slate\Slate.exe'
          # 0.15.0, from its release
          $old = Join-Path $env:RUNNER_TEMP 'slate-0.15.0'
          New-Item -ItemType Directory -Force $old | Out-Null
          $url = 'https://github.com/jamesccupps/Slate/releases/download/v0.15.0'
          Invoke-WebRequest "$url/Slate.exe" -OutFile "$old\Slate.exe"
          Invoke-WebRequest "$url/Slate.exe.sha256" -OutFile "$old\Slate.exe.sha256"
          $want = ((Get-Content "$old\Slate.exe.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash "$old\Slate.exe" -Algorithm SHA256).Hash -ne $want) { throw "0.15.0's Slate.exe doesn't match its .sha256" }
          # Twice: a plain update, and one over what a test build of 0.16.0 left when its move failed (empty keys under
          # the new names and its own, Default apps pointing at its own, the old name dropped there).
          foreach ($leftovers in $false, $true) {
            "== update from 0.15.0$(if ($leftovers) { ' over a failed test build' })"
            $p = Start-Process -FilePath "$old\Slate.exe" -ArgumentList '--install' -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "0.15.0's --install failed (exit code $($p.ExitCode))" }
            if (!(Test-Path -LiteralPath "$un\Slate") -or !(Test-Path 'HKCU:\Software\Slate\Capabilities') -or !(Test-Path -LiteralPath "$classes\*\shell\Slate")) { throw "0.15.0 didn't register under its names" }
            if ($leftovers) {
              foreach ($k in 'Software\Slate Text Editor', 'Software\Classes\*\shell\Slate Text Editor', 'Software\Microsoft\Windows\CurrentVersion\Uninstall\Slate Text Editor', 'Software\JamesCupps\Slate', 'Software\Classes\*\shell\JamesCupps.Slate', 'Software\Microsoft\Windows\CurrentVersion\Uninstall\JamesCupps.Slate') {
                reg add "HKCU\$k" /f | Out-Null
              }
              reg add 'HKCU\Software\RegisteredApplications' /v JamesCupps.Slate /d 'Software\JamesCupps\Slate\Capabilities' /f | Out-Null
              reg delete 'HKCU\Software\RegisteredApplications' /v Slate /f | Out-Null
            }
            # this one installed over it (a winget upgrade; an update in Slate moves them at its next start the same way)
            $p = Start-Process -FilePath target\release\Slate.exe -ArgumentList '--install' -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "--install over 0.15.0 failed (exit code $($p.ExitCode))" }
            $left = @("$un\Slate", 'HKCU:\Software\Slate', "$classes\*\shell\Slate", 'HKCU:\Software\JamesCupps', "$classes\*\shell\JamesCupps.Slate", "$un\JamesCupps.Slate") | Where-Object { Test-Path -LiteralPath $_ }
            $left += @('Slate', 'JamesCupps.Slate') | Where-Object { Has $apps $_ } | ForEach-Object { "Default apps' $_" }
            if ($left) { throw "the update left $($left -join ', ')" }
            $entry = Get-ItemProperty -LiteralPath "$un\Slate Text Editor"
            "$($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher): $($entry.QuietUninstallString)"
            if ($entry.DisplayVersion -ne $v) { throw "Installed apps says $($entry.DisplayVersion), not $v" }
            if ((Get-ItemProperty $apps).'Slate Text Editor' -ne 'Software\Slate Text Editor\Capabilities') { throw "Default apps doesn't list Slate under its new name" }
            if (!(Has 'HKCU:\Software\Slate Text Editor\Capabilities\FileAssociations' '.txt')) { throw ".txt isn't in Slate's Default apps list" }
            if ((Get-ItemProperty 'HKCU:\Software\Slate Text Editor').Registration -ne 2) { throw "the note that the old file types were cleaned up didn't move" }
            if (!(Test-Path -LiteralPath "$classes\*\shell\Slate Text Editor\command")) { throw "Edit with Slate isn't there under its new name" }
            $p = Start-Process -FilePath $exe -ArgumentList '--uninstall', '--quiet' -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "--uninstall failed (exit code $($p.ExitCode))" }
            $left = @("$un\Slate Text Editor", 'HKCU:\Software\Slate Text Editor', "$classes\*\shell\Slate Text Editor") | Where-Object { Test-Path -LiteralPath $_ }
            if ($left) { throw "--uninstall left $($left -join ', ')" }
            # (its folder goes a moment after it ended)
            foreach ($k in 1..20) { if (!(Test-Path (Split-Path $exe))) { break }; Start-Sleep -Seconds 1 }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\Slate.exe out\Slate.exe
          $hash = (Get-FileHash out\Slate.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Slate.exe" | Out-File -FilePath out\Slate.exe.sha256 -Encoding ascii -NoNewline
          Get-Content out\Slate.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Slate
          path: out/

  sign:
    # Signs a release's Slate.exe with the certificate in Azure Artifact Signing (account SlateAccount, profile
    # Slate), signing in to Azure with GitHub's OIDC token: no password is stored anywhere. Azure trusts only jobs in
    # the "release" environment of this repository, and that environment only version tags.
    name: Sign Slate.exe
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Slate
          path: out

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: SlateAccount
          certificate-profile-name: Slate
          files: ${{ github.workspace }}\out\Slate.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature, test the signed exe, hash it again
        shell: pwsh
        timeout-minutes: 5
        run: |
          $s = Get-AuthenticodeSignature out\Slate.exe
          "$($s.Status): $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "Slate.exe isn't validly signed: $($s.StatusMessage)" }
          $dir = Join-Path $env:RUNNER_TEMP smoke
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:SLATE_DATA_DIR = Join-Path $dir data
          $env:SLATE_TEST_LOG = Join-Path $dir log.txt
          $p = Start-Process -FilePath out\Slate.exe -ArgumentList '--test', "$PWD\tests\smoke.txt" -WorkingDirectory $dir -Wait -PassThru -NoNewWindow
          if (Test-Path $env:SLATE_TEST_LOG) { Get-Content $env:SLATE_TEST_LOG }
          if ($p.ExitCode -ne 0) { throw "The smoke test failed on the signed exe (exit code $($p.ExitCode))" }
          # The updater checks the download against this, so it's the signed file's hash.
          $hash = (Get-FileHash out\Slate.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Slate.exe" | Out-File -FilePath out\Slate.exe.sha256 -Encoding ascii -NoNewline
          Get-Content out\Slate.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Slate
          path: out/
          overwrite: true

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 (GTK 4.8, glibc 2.36): it then runs there, on Raspberry Pi OS 12 and on newer systems.
    container: debian:12
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libgtk-4-dev \
            xvfb xauth dbus-x11 fonts-dejavu-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test
        run: cargo test --lib --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test (the built program, in its test mode, under Xvfb)
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          cd "$dir"
          export SLATE_DATA_DIR="$dir/data" SLATE_TEST_LOG="$dir/log.txt" GTK_A11Y=none GSK_RENDERER=cairo
          status=0
          xvfb-run -a "$GITHUB_WORKSPACE/target/release/Slate" --test "$GITHUB_WORKSPACE/tests/smoke-linux.txt" || status=$?
          cat log.txt || true
          if [ "$status" -ne 0 ]; then echo "The smoke test failed (exit code $status)"; exit 1; fi

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          # A build that isn't a release gets a version just below it (0.8.0~dev42): such a test package installs
          # over the release before, and the release installs over it.
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="$version~dev$GITHUB_RUN_NUMBER" ;; esac
          sh packaging/linux/package.sh target/release/Slate "$version" ${{ matrix.arch }} out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slate-linux-${{ matrix.arch }}
          path: out/

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ls -la out
          # The notes come from docs/release-notes-<version>.md when there is one.
          notes="docs/release-notes-${tag#v}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # Run again (the release is there already): replace its files, only while it's a draft (a published
            # release's files are what people downloaded, and what the updater checks against).
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$tag is published: its files stay as they are." >&2
              exit 1
            fi
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --draft --title "Slate $tag" "$@"
          fi
