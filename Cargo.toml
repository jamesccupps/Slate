[package]
name = "slate"
version = "0.8.0"
edition = "2024"
description = "A fast, simple text editor for Windows that handles huge files"
license = "MIT"
repository = "https://github.com/jamesccupps/Slate"
build = "build.rs"

[lib]
name = "slate"
path = "src/lib.rs"

[[bin]]
name = "Slate"
path = "src/main.rs"

[dependencies]
bytecount = { version = "0.6.9", features = ["runtime-dispatch-simd"] }
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# GTK 4.8 is what Debian 12 and Raspberry Pi OS 12 have.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", features = ["v4_8"] }
pangocairo = "0.22"

# 0.58 is the newest version that links with the GNU toolchain's bundled linker (later versions use raw-dylib,
# which needs an assembler that isn't bundled). See CLAUDE.md "Build".
[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
panic = "unwind"
